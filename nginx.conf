events {
    worker_connections 1024;
}

http {
    upstream n8n {
        server n8n:5678;
    }

    upstream waha {
        server waha_server:3000;
    }

    # Configuración para N8N
    server {
        listen 80;
        server_name _;

        # Aumentar tamaños de buffer para N8N
        client_max_body_size 50M;
        proxy_buffering off;
        proxy_request_buffering off;

        # Headers para WebSocket y conexiones persistentes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts para conexiones largas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Ruta principal para N8N
        location / {
            proxy_pass http://n8n;
        }

        # Webhooks de N8N
        location /webhook/ {
            proxy_pass http://n8n;
        }

        # API de N8N
        location /rest/ {
            proxy_pass http://n8n;
        }

        # Assets de N8N
        location /assets/ {
            proxy_pass http://n8n;
        }

        # Ruta para WAHA Dashboard
        location /waha/ {
            rewrite ^/waha/(.*) /$1 break;
            proxy_pass http://waha;
        }

        # API de WAHA
        location /waha-api/ {
            rewrite ^/waha-api/(.*) /api/$1 break;
            proxy_pass http://waha;
        }

        # Documentación de WAHA
        location /waha-docs/ {
            rewrite ^/waha-docs/(.*) /docs/$1 break;
            proxy_pass http://waha;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}