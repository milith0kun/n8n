version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: n8n_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - n8n
      - waha
    networks:
      - n8n_network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_local
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - N8N_HOST=${SERVER_IP:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${SERVER_IP:-localhost}/webhook/
      - N8N_EDITOR_BASE_URL=http://${SERVER_IP:-localhost}/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-data:/data
    networks:
      - n8n_network

  waha:
    image: devlikeapro/waha
    container_name: waha_server
    restart: unless-stopped
    environment:
      - WAHA_WEBHOOK_URL=http://${SERVER_IP:-localhost}/webhook/whatsapp
      - WAHA_WEBHOOK_EVENTS=message,message.any
      - WAHA_DASHBOARD_USERNAME=${WAHA_USER:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_PASSWORD:-waha123}
    networks:
      - n8n_network

volumes:
  n8n_data:

networks:
  n8n_network:
    driver: bridge